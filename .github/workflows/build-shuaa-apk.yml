name: Build شُعاع APK

on:
  push:
    paths:
      - "shuaa-remote/**"
      - ".github/workflows/build-shuaa-apk.yml"
  workflow_dispatch:

jobs:
  build:
    name: بناء ملف APK
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء نسخة التطوير
        working-directory: shuaa-remote
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: shuaa-remote-apk
          path: shuaa-remote/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
