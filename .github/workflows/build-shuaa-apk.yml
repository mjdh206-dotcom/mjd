name: بناء تطبيقي محامص الحرمين

on:
  push:
    paths:
      - "al-haramain-customer/**"
      - "al-haramain-store/**"
      - ".github/workflows/build-shuaa-apk.yml"
  workflow_dispatch:
    inputs:
      commit_apk:
        description: "حفظ ملفي APK في مجلد dist"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: بناء APK الزبون والمتجر
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء التطبيقين
        id: gradle_build
        continue-on-error: true
        run: |
          set -o pipefail
          (
            cd al-haramain-customer
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
            cd ../al-haramain-store
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          ) 2>&1 | tee ci-build.log

      - name: حفظ سجل البناء عند الفشل
        if: steps.gradle_build.outcome != 'success'
        run: |
          git config user.name "haramain-build-bot"
          git config user.email "haramain-build-bot@users.noreply.github.com"
          mkdir -p ci-logs
          cp ci-build.log ci-logs/last-build.log
          grep -nE "e: file|e: |error:|FAILURE|What went wrong|Caused by|Unresolved|FAILED" ci-build.log > ci-logs/errors.txt || true
          git add -f ci-logs
          git commit -m "ci: سجل بناء فاشل [skip ci]" || echo "لا تغييرات"
          git push origin HEAD:${{ github.ref_name }}

      - name: رفع ملفي APK
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: al-haramain-android-apks
          path: |
            al-haramain-customer/app/build/outputs/apk/debug/app-debug.apk
            al-haramain-store/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: حفظ ملفي APK في المستودع
        if: steps.gradle_build.outcome == 'success' && (inputs.commit_apk == true || contains(github.event.head_commit.message, '[save-apk]'))
        run: |
          git config user.name "haramain-build-bot"
          git config user.email "haramain-build-bot@users.noreply.github.com"
          mkdir -p dist
          cp al-haramain-customer/app/build/outputs/apk/debug/app-debug.apk dist/al-haramain-customer-1.0.0.apk
          cp al-haramain-store/app/build/outputs/apk/debug/app-debug.apk dist/al-haramain-store-1.0.0.apk
          git add -f dist/al-haramain-customer-1.0.0.apk dist/al-haramain-store-1.0.0.apk
          git commit -m "build: APK زبائن وإدارة محامص الحرمين 1.0.0 [skip ci]" || echo "لا تغييرات"
          git push origin HEAD:${{ github.ref_name }}

      - name: إيقاف عند الفشل
        if: steps.gradle_build.outcome != 'success'
        run: exit 1
